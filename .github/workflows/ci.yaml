name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The package build runs rustfmt, clippy (-D warnings) and the tests
      - name: Build & test
        run: nix build -L

  # Advisories, licenses, banned/duplicate crates and crate sources (deny.toml)
  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2

  # Single stable status for a branch ruleset to require
  ci-ok:
    name: ci-ok
    needs: [test, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to have succeeded
        env:
          TEST: ${{ needs.test.result }}
          DENY: ${{ needs.deny.result }}
        run: '[ "$TEST" = success ] && [ "$DENY" = success ]'
